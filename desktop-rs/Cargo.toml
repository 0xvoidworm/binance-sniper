[package]
name = "binance-desk"
version = "0.6.14"
edition = "2024"
rust-version = "1.98"
description = "Native Linux desktop for the personal Binance trading engine"
publish = false

[dependencies]
anyhow = "=1.0.104"
binance-engine = { path = "../engine-rs", version = "=0.1.0" }
clap = { version = "=4.6.7", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
png = "=0.18.1"
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std", "serde-str"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "macros", "net"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
zeroize = "=1.9.0"
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
http = "=1.5.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
strip = "debuginfo"
