[package]
name = "binance-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Local, journaled execution and risk core for Binance research"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std", "serde-str"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true

