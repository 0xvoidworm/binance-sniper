<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Sniper</title>
<style>
:root{--bg:#0b0e12;--panel:#121820;--line:#273442;--text:#e8f0f5;--muted:#8da0ad;--cyan:#57d9e8;--amber:#f5b84b;--green:#48d597;--red:#ff6f7d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#15232b 0,#0b0e12 42%);color:var(--text);font:14px/1.45 Segoe UI,system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px;letter-spacing:.04em}small,.muted{color:var(--muted)}main{padding:20px 28px;display:grid;grid-template-columns:1.7fr 1fr;gap:18px}.panel{background:rgba(18,24,32,.92);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 12px 32px #0005}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}select,button{background:#1b2731;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:8px 10px}button{cursor:pointer}canvas{width:100%;height:430px;background:#0d1318;border:1px solid #21303b;border-radius:5px}.badges{display:flex;flex-wrap:wrap;gap:7px}.badge{padding:5px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:11px;background:#0d141a;border-left:2px solid var(--cyan);min-height:62px}.metric b{display:block;font-size:17px}.bull{color:var(--green)}.bear{color:var(--red)}.warn{color:var(--amber)}.events{max-height:260px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px}.event{padding:8px 0;border-bottom:1px solid #1e2932}@media(max-width:900px){main{grid-template-columns:1fr;padding:14px}.panel{padding:12px}header{padding:16px}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div><h1>BINANCE SNIPER</h1><small>USDⓈ-M Futures · live observation · read-only</small></div><div id="connection" class="badge">CONNECTING</div></header><main><section class="panel"><div class="toolbar"><select id="symbol"></select><select id="tf"><option>5m</option><option>15m</option><option>1h</option><option>4h</option></select><span class="muted">closed candles only</span></div><canvas id="chart" width="1000" height="430"></canvas></section><section class="panel"><div class="grid" id="metrics"></div><div class="badges" id="symbols"></div><h3>Account read-only</h3><div id="account" class="muted">Loading...</div><h3>Audit events</h3><div id="events" class="events"></div></section></main>
<script>
const $=id=>document.getElementById(id), state={}; let chosen='BTCUSDT', tf='5m'; $('symbol').onchange=e=>{chosen=e.target.value;render()}; $('tf').onchange=e=>{tf=e.target.value;render()};
function fmt(v){return typeof v==='number'?v.toFixed(5):v??'-'}
function draw(){let c=$('chart'),x=c.getContext('2d'),s=state.symbols?.[chosen],candles=state.charts?.[chosen+':'+tf]||[];x.clearRect(0,0,c.width,c.height);x.strokeStyle='#253642';for(let i=1;i<6;i++){x.beginPath();x.moveTo(0,i*c.height/6);x.lineTo(c.width,i*c.height/6);x.stroke()}if(!s)return;x.fillStyle='#8da0ad';x.font='14px Segoe UI';x.fillText(chosen+'  '+tf+'  '+(s.bias||'NEUTRAL'),18,25);x.fillText('Feed: '+(state.feed_quality?.[chosen+':'+tf]?.status||'WAITING')+' · closed bars '+candles.length,18,47);if(candles.length){let lo=Math.min(...candles.map(v=>v.low)),hi=Math.max(...candles.map(v=>v.high)),pad=(hi-lo)*.08||1,scale=v=>c.height-35-(v-(lo-pad))/(hi-lo+2*pad)*(c.height-70),step=(c.width-100)/candles.length; candles.forEach((v,i)=>{let xx=65+i*step, color=v.close>=v.open?'#48d597':'#ff6f7d';x.strokeStyle=color;x.beginPath();x.moveTo(xx,scale(v.high));x.lineTo(xx,scale(v.low));x.stroke();x.fillStyle=color;x.fillRect(xx-3,Math.min(scale(v.open),scale(v.close)),6,Math.max(1,Math.abs(scale(v.open)-scale(v.close))))})}if(s.zone){let z=s.zone;let lo=Math.min(...candles.map(v=>v.low)),hi=Math.max(...candles.map(v=>v.high)),pad=(hi-lo)*.08||1,scale=v=>c.height-35-(v-(lo-pad))/(hi-lo+2*pad)*(c.height-70);x.strokeStyle='#f5b84b';x.setLineDash([5,4]);x.strokeRect(65,scale(z.upper),c.width-100,Math.max(8,scale(z.lower)-scale(z.upper)));x.setLineDash([]);x.fillStyle='#f5b84b';x.fillText('M15 zone '+z.state,75,scale(z.upper)-8)}if(s.trigger){x.fillStyle='#57d9e8';x.beginPath();x.arc(c.width*.72,185,7,0,Math.PI*2);x.fill();x.fillText('TRIGGER '+s.trigger.reason_code,c.width*.72-90,135)}}
function render(){let s=state.symbols?.[chosen]||{};$('connection').textContent=Object.values(state.feed_quality||{}).some(x=>x.status==='LIVE')?'LIVE':'STALE';$('connection').className='badge '+($('connection').textContent==='LIVE'?'bull':'warn'); $('metrics').innerHTML=[['Bias',s.bias||'NEUTRAL'],['Impulse',s.impulse?'CONFIRMED':'-'],['Zone',s.zone?.state||'-'],['Trigger',s.trigger?.reason_code||'NO_TRIGGER'],['Candidates',state.candidates?.length||0],['Reconnects',state.reconnects||0]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('symbols').innerHTML=Object.entries(state.symbols||{}).map(([k,v])=>`<span class="badge ${v.bias==='BULLISH'?'bull':v.bias==='BEARISH'?'bear':''}">${k} ${v.bias||'-'}</span>`).join('');$('events').innerHTML=(state.events||[]).slice(0,25).map(e=>`<div class="event">${new Date(e.time).toLocaleTimeString()} · ${e.symbol} · ${e.reason_code} · ${e.status}</div>`).join('');draw()}
async function load(){try{let r=await fetch('/api/state');Object.assign(state,await r.json());let keys=Object.keys(state.symbols||{});if(keys.length&&!$('symbol').options.length){$('symbol').innerHTML=keys.map(k=>`<option>${k}</option>`).join('')}render();let a=await fetch('/api/account');let ac=await a.json();$('account').innerHTML=ac.auth==='CONNECTED'?`auth <b class="bull">CONNECTED</b><br>position mode ${ac.position_mode}<br>positions ${ac.positions} · orders ${ac.orders}<br>available balance ${ac.available_balance}<br><span class="warn">${ac.warning||''}</span>`:`<span class="warn">${ac.auth}</span><br>${ac.note}` }catch(e){$('connection').textContent='DISCONNECTED'}}const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=e=>{Object.assign(state,JSON.parse(e.data));render()};load();setInterval(load,15000)
</script></body></html>
