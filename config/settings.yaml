app:
  host: 127.0.0.1
  port: 8765
  log_level: INFO
binance:
  rest_base: https://fapi.binance.com
  websocket_base: wss://fstream.binance.com/stream
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT]
  timeframes: [4h, 1h, 15m, 5m]
  warmup_limit: 220
  reconnect_max_seconds: 60
  ws_silent_seconds: 15
  rest_poll_seconds: 5
  rest_poll_seconds_by_timeframe: {5m: 3, 15m: 5, 1h: 15, 4h: 30}
  rest_concurrency: 6
  feed_stale_multiplier: 3
  websocket_renew_seconds: 82800
strategy:
  pivot_left_right: 2
  pullback_min_depth: 0.25
  pullback_max_depth: 0.70
  pullback_max_bars: 12
  zone_atr_width: 0.20
  trigger_min_body_fraction: 0.45
  four_bar_horizon: 4
security:
  credentials_path: null
  ip_restrict_warning_only: true
